<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>SpeakEasy — Esercizi Pratici</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f0a1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  html, body { overflow-y: auto; height: auto; }

  .ex-screen {
    min-height: 100vh;
    height: auto;
    justify-content: flex-start;
    gap: 1.2rem;
    padding: 1.5rem 1.4rem 3rem;
  }

  .ex-topbar {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .back-link {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 1.3rem;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ex-title {
    font-family: var(--font-heading);
    font-size: 1.2rem;
  }

  .ex-topics, .ex-units {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }

  .ex-tabs {
    width: 100%;
    max-width: 480px;
    display: flex;
    gap: 0.5rem;
    background: var(--surface);
    padding: 0.3rem;
    border-radius: var(--radius-full);
  }

  .ex-tab {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: var(--font-heading);
    font-size: 0.8rem;
    padding: 0.55rem 0.6rem;
    border-radius: var(--radius-full);
  }

  .ex-tab.active {
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
    color: #1a1233;
  }

  .verifica-card { border-left-color: #f87171 !important; }

  .cloze-text {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 1.2rem;
    font-size: 0.95rem;
    line-height: 2.1;
  }

  .cloze-blank-wrap {
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
    margin: 0 0.1rem;
  }

  .cloze-num {
    font-size: 0.7rem;
    color: var(--text-dim);
    vertical-align: super;
  }

  .cloze-input {
    width: 90px;
    background: var(--surface-2);
    border: 2px solid var(--surface-2);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 0.2rem 0.4rem;
    font-size: 0.9rem;
    font-family: var(--font-body);
    text-align: center;
  }

  .cloze-input.correct { border-color: var(--accent-green); }
  .cloze-input.wrong { border-color: #f87171; }

  .cloze-base-verb {
    font-size: 0.78rem;
    color: var(--text-dim);
    font-style: italic;
  }

  .cloze-results {
    margin-top: 1rem;
  }
  .cloze-result-item {
    background: var(--surface-2);
    border-radius: var(--radius-md);
    padding: 0.7rem 0.9rem;
    margin-bottom: 0.5rem;
    font-size: 0.85rem;
  }

  .unit-subtitle {
    font-size: 0.76rem;
    color: var(--text-dim);
    margin-top: 0.1rem;
  }

  .back-to-units {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.82rem;
    text-align: left;
    padding: 0.3rem 0;
    margin-bottom: -0.3rem;
  }

  .topic-card {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    width: 100%;
    box-sizing: border-box;
    background: var(--surface);
    border: none;
    border-left: 4px solid var(--accent-purple);
    border-radius: var(--radius-md);
    padding: 0.9rem 1.1rem;
    min-height: 60px;
    text-align: left;
    color: var(--text);
    font-family: var(--font-body);
  }
  .topic-card:active { transform: scale(0.97); }
  .topic-icon { font-size: 1.4rem; flex-shrink: 0; }
  .topic-title { font-family: var(--font-heading); font-size: 0.95rem; }
  .topic-desc { font-size: 0.76rem; color: var(--text-dim); margin-top: 0.1rem; }

  .topic-card {
    opacity: 0;
    transform: translateY(-10px);
    animation: ex-drop 0.4s ease forwards;
    transition: transform 0.15s ease;
  }
  .ex-topics .topic-card:nth-child(1), .ex-units .topic-card:nth-child(1) { animation-delay: 0.04s; }
  .ex-topics .topic-card:nth-child(2), .ex-units .topic-card:nth-child(2) { animation-delay: 0.09s; }
  .ex-topics .topic-card:nth-child(3), .ex-units .topic-card:nth-child(3) { animation-delay: 0.14s; }
  .ex-topics .topic-card:nth-child(4), .ex-units .topic-card:nth-child(4) { animation-delay: 0.19s; }
  .ex-topics .topic-card:nth-child(5), .ex-units .topic-card:nth-child(5) { animation-delay: 0.24s; }
  .ex-topics .topic-card:nth-child(6), .ex-units .topic-card:nth-child(6) { animation-delay: 0.29s; }
  .ex-topics .topic-card:nth-child(7), .ex-units .topic-card:nth-child(7) { animation-delay: 0.34s; }
  @keyframes ex-drop {
    to { opacity: 1; transform: translateY(0); }
  }

  .ex-fade-in { animation: ex-fade 0.35s ease forwards; }
  @keyframes ex-fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .ex-state {
    width: 100%;
    max-width: 480px;
    text-align: center;
    color: var(--text-dim);
    padding: 2rem 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
  }

  .ex-loading-dots { display: flex; gap: 5px; }
  .ex-loading-dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-purple);
    animation: ex-bounce 1.2s ease-in-out infinite;
  }
  .ex-loading-dots span:nth-child(2) { animation-delay: 0.15s; }
  .ex-loading-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes ex-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  .ex-error {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-left: 4px solid #f87171;
    border-radius: var(--radius-md);
    padding: 1rem 1.2rem;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  .fb-rule {
    display: inline-block;
    padding: 0.3rem 0.7rem;
    border-radius: var(--radius-full);
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
    font-family: var(--font-heading);
    font-size: 0.76rem;
    color: #1a1233;
  }

  .ex-quiz {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .ex-progress {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text-dim);
    font-size: 0.8rem;
  }

  .ex-progress-track {
    flex: 1;
    height: 5px;
    background: var(--surface);
    border-radius: var(--radius-full);
    margin: 0 0.8rem;
    overflow: hidden;
  }
  .ex-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
    transition: width 0.3s ease;
  }

  .ex-question-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 1.3rem;
  }

  .ex-question-text {
    font-size: 1.02rem;
    line-height: 1.5;
    margin-bottom: 1rem;
  }

  .ex-option {
    display: block;
    width: 100%;
    box-sizing: border-box;
    background: var(--surface-2);
    border: 2px solid transparent;
    color: var(--text);
    border-radius: var(--radius-md);
    padding: 0.8rem 1rem;
    margin-bottom: 0.6rem;
    text-align: left;
    font-family: var(--font-body);
    font-size: 0.92rem;
  }
  .ex-option.correct { border-color: var(--accent-green); background: rgba(74,222,128,0.12); }
  .ex-option.wrong { border-color: #f87171; background: rgba(248,113,113,0.12); }
  .ex-option:disabled { opacity: 0.9; }

  .ex-fill-input {
    width: 100%;
    box-sizing: border-box;
    background: var(--surface-2);
    border: 2px solid var(--surface-2);
    color: var(--text);
    border-radius: var(--radius-md);
    padding: 0.8rem 1rem;
    font-size: 16px;
    font-family: var(--font-body);
    margin-bottom: 0.8rem;
  }
  .ex-fill-input.correct { border-color: var(--accent-green); }
  .ex-fill-input.wrong { border-color: #f87171; }

  .ex-feedback {
    margin-top: 0.6rem;
    padding: 0.8rem 1rem;
    border-radius: var(--radius-md);
    font-size: 0.86rem;
    background: var(--surface-2);
  }
  .ex-feedback.ok { color: var(--accent-green); }
  .ex-feedback.no { color: #f87171; }
  .ex-feedback .explain { color: var(--text-dim); font-size: 0.82rem; margin-top: 0.3rem; }

  .ex-final {
    text-align: center;
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 2rem 1.4rem;
  }
  .ex-final-score {
    font-family: var(--font-heading);
    font-size: 2rem;
    margin-bottom: 0.5rem;
  }

  .ex-actions { display: flex; justify-content: center; gap: 0.6rem; padding-top: 0.4rem; }

  .real-test-header {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
    margin-bottom: -0.2rem;
  }

  .real-section {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  .real-section-title {
    font-family: var(--font-heading);
    font-size: 0.95rem;
  }

  .real-instructions {
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-top: -0.4rem;
  }

  .word-bank {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .word-chip {
    background: var(--surface-2);
    color: var(--accent-blue);
    border-radius: var(--radius-full);
    padding: 0.3rem 0.7rem;
    font-size: 0.8rem;
  }

  .match-list {
    background: var(--surface-2);
    border-radius: var(--radius-md);
    padding: 0.7rem 0.9rem;
    font-size: 0.82rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .real-item {
    display: flex;
    gap: 0.5rem;
    padding-top: 0.6rem;
    border-top: 1px solid var(--surface-2);
  }
  .real-item:first-of-type { border-top: none; padding-top: 0; }

  .real-item-num {
    font-family: var(--font-heading);
    color: var(--text-dim);
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .real-item-body {
    flex: 1;
    font-size: 0.92rem;
    line-height: 1.6;
  }

  .real-item-q { margin-bottom: 0.5rem; }

  .real-radio {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--surface-2);
    border: 2px solid transparent;
    border-radius: var(--radius-md);
    padding: 0.55rem 0.8rem;
    margin-bottom: 0.4rem;
    font-size: 0.88rem;
  }
  .real-radio.correct { border-color: var(--accent-green); background: rgba(74,222,128,0.12); }
  .real-radio.wrong { border-color: #f87171; background: rgba(248,113,113,0.12); }

  .real-inline-input, .real-inline-select {
    background: var(--surface-2);
    border: 2px solid var(--surface-2);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 0.3rem 0.5rem;
    font-size: 0.9rem;
    font-family: var(--font-body);
  }
  .real-inline-input { width: 130px; text-align: center; }
  .real-inline-input.correct, .real-inline-select.correct { border-color: var(--accent-green); }
  .real-inline-input.wrong, .real-inline-select.wrong { border-color: #f87171; }

  .real-trans-original { color: var(--text-dim); margin-bottom: 0.4rem; }
  .real-trans-keyword { color: var(--accent-purple); font-weight: 700; }
  .real-trans-input { width: 100%; box-sizing: border-box; text-align: left; }

  .real-item-hint {
    margin-top: 0.4rem;
    font-size: 0.8rem;
    color: var(--accent-green);
  }

  .real-section-score {
    align-self: flex-end;
    font-family: var(--font-heading);
    font-size: 0.85rem;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<div class="screen ex-screen">
  <div class="ex-topbar">
    <a href="index.html" class="back-link">←</a>
    <span class="ex-title">✏️ Esercizi Pratici</span>
  </div>

  <div class="ex-tabs" id="ex-tabs">
    <button class="ex-tab active" id="ex-tab-topic" type="button">Per argomento</button>
    <button class="ex-tab" id="ex-tab-verifica" type="button">📝 Verifica</button>
    <button class="ex-tab" id="ex-tab-real" type="button">📋 Reale</button>
  </div>

  <div class="ex-units" id="ex-units"></div>
  <div class="ex-topics" id="ex-topics" style="display:none;"></div>
  <div class="ex-units" id="ex-verifica-menu" style="display:none;"></div>

  <div id="ex-content"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="api-config.js"></script>
<script src="js/storage.js"></script>
<script src="js/ai-content.js"></script>
<script>
  const SYSTEM_PROMPT = `Stai creando esercizi di grammatica inglese per una ragazza italiana di 15 anni al liceo scientifico Cambridge, livello B1+.

Genera ESATTAMENTE 5 esercizi sull'argomento richiesto. Rispondi SOLO con un array JSON valido (niente markdown, niente code fence) con questa forma:
[
  {
    "type": "multiple_choice",
    "question": "...",
    "options": ["...", "...", "..."],
    "correctAnswer": "...",
    "rule": "...",
    "explanation_it": "..."
  }
]

Regole:
- "type" è "multiple_choice" (3-4 "options", "correctAnswer" deve combaciare esattamente il testo di una option) oppure "fill_blank" (la domanda contiene uno spazio da riempire indicato con ___, "correctAnswer" è la parola/frase esatta attesa, minuscola, senza punteggiatura, niente "options")
- Mix di entrambi i tipi tra i 5 esercizi
- Varia i verbi usati, non ripetere sempre lo stesso esempio
- "rule" è il nome preciso della regola grammaticale coinvolta (es. "Present Perfect con for/since")
- "explanation_it" in italiano, breve, chiara, non condiscendente`;

  const VERIFICA_SYSTEM_PROMPT = `Stai creando una verifica di grammatica inglese difficile per una studentessa di 15 anni al primo anno di liceo scientifico Cambridge, livello B1+. Genera ESATTAMENTE 20 esercizi che mischiano tempi verbali diversi, modali, comparativi, condizionali, relative clauses, verb patterns, in ordine casuale e senza ripetere sempre lo stesso punto grammaticale.

Rispondi SOLO con un array JSON valido (niente markdown) con questa forma:
[{"type":"multiple_choice","question":"...","options":["...","...","...","..."],"correctAnswer":"...","rule":"...","explanation_it":"..."}]

- "type" è "multiple_choice" (4 "options", distrattori plausibili non ovvi) oppure "fill_blank" (spazio indicato con ___, "correctAnswer" minuscolo senza punteggiatura)
- Difficoltà alta come una vera verifica scolastica, non esercizi banali
- "rule" è il nome preciso della regola coinvolta in ciascuna domanda
- "explanation_it" in italiano, chiara`;

  const CLOZE_SYSTEM_PROMPT = `Stai creando un testo per una verifica di inglese in stile cloze (completamento) per una studentessa di 15 anni al liceo scientifico Cambridge, livello B1+, sullo stile delle verifiche scolastiche reali. Scrivi un racconto di 10-14 frasi con circa 16-18 spazi vuoti, ciascuno segnato con un numero tra parentesi quadre tipo [1], dove lo studente deve scrivere la forma corretta del verbo indicato tra parentesi tonde subito dopo. Mischia tempi diversi (presente, passato, futuro, perfetto, condizionale) e qualche modale.

Rispondi SOLO con un oggetto JSON valido (niente markdown): {"text": "... testo con [1] (go) ... [2] (see) ...", "blanks": [{"number":1,"baseVerb":"go","correctAnswer":"...","rule":"..."}]}

Il campo "text" deve contenere il numero tra parentesi quadre E il verbo base tra parentesi tonde inline nel testo, così lo studente sa quale verbo coniugare. "correctAnswer" minuscolo, senza punteggiatura. "rule" è il nome preciso della regola coinvolta per quello spazio.`;

  const REAL_TEST_SYSTEM_PROMPT = `Stai creando una verifica di inglese in stile Cambridge per una studentessa italiana di 15 anni, livello B1+, sull'argomento richiesto. Deve rispecchiare fedelmente il formato reale delle verifiche scolastiche: più sezioni con tipi di esercizio diversi.

Rispondi SOLO con un oggetto JSON valido (niente markdown, niente code fence) con questa forma:
{"sections":[
  {"type":"multiple_choice","instructions":"...","items":[{"number":1,"question":"...","options":{"A":"...","B":"...","C":"..."},"correctAnswer":"B"}]},
  {"type":"word_bank_fill","instructions":"...","wordBank":["...","..."],"items":[{"number":1,"text":"...___...","correctAnswer":"..."}]},
  {"type":"matching_complete","instructions":"...","listA":["...","..."],"listB":["...","..."],"items":[{"number":1,"text":"...___","correctAnswer":"..."}]},
  {"type":"transformation","instructions":"...","items":[{"number":1,"original":"...","keyword":"...","starter":"...","correctAnswer":"..."}]}
]}

Regole IMPORTANTI:
- Genera esattamente 5 items per sezione, nell'ordine: multiple_choice, word_bank_fill, matching_complete, transformation
- wordBank e listA devono avere 1-2 elementi extra rispetto agli items (distrattori)
- listB: NIENTE lettere o numeri davanti al testo (niente "A. ..." o "1. ..."), solo il testo puro — le lettere le aggiunge l'interfaccia
- "correctAnswer" in matching_complete deve combaciare ESATTAMENTE (carattere per carattere) il testo di un elemento di listB
- "correctAnswer" in multiple_choice è una lettera tra quelle usate in "options" (es. "B")
- "starter" in transformation è l'inizio della frase che lo studente deve completare, "correctAnswer" è la frase COMPLETA corretta (starter incluso)
- Contenuto naturale, vario, difficoltà da vera verifica scolastica sull'argomento richiesto
- "instructions" per ogni sezione: breve consegna in italiano che spiega cosa fare in quella sezione`;

  const SECTION_META = {
    multiple_choice: { icon: '🔘', title: 'Scelta multipla' },
    word_bank_fill: { icon: '🧰', title: 'Completa con le parole della lista' },
    matching_complete: { icon: '🔗', title: 'Collega e completa' },
    transformation: { icon: '🔄', title: 'Trasforma la frase' },
  };

  const UNITS = [
    { id: 'u1', title: 'Unit 1', subtitle: 'Appearance, personality and relationships', emoji: '🧑', topics: [
      { label: 'Present Simple vs Continuous', desc: 'Verbi stativi e dinamici', prompt: 'Present Simple vs Present Continuous, inclusa la differenza tra verbi stativi (stative) e dinamici' },
      { label: 'Domande soggetto e oggetto', desc: 'Wh-questions', prompt: 'Subject and object questions, Wh-questions che finiscono con una preposizione' },
      { label: 'Aggettivi di personalità', desc: 'Emozioni in -ing e -ed', prompt: 'Aggettivi di personalità, contrari, prefissi negativi, aggettivi + preposizione, aggettivi di emozione in -ing e -ed' },
      { label: 'Present Perfect (for/since)', desc: 'Durata nel presente', prompt: 'Present Perfect per esprimere la durata nel presente con for e since' },
    ]},
    { id: 'u2', title: 'Unit 2', subtitle: 'Sport and Leisure', emoji: '⚽', topics: [
      { label: 'Past Simple vs Continuous', desc: 'Azioni in corso nel passato', prompt: 'Past Simple vs Past Continuous, uso di when e while' },
      { label: 'Past Simple vs Present Perfect', desc: 'Passato definito e indefinito', prompt: 'Past Simple vs Present Perfect, uso di ever/never/already/yet/still/just, been vs gone' },
      { label: 'Used to / Would', desc: 'Abitudini passate', prompt: 'Used to e would per esprimere abitudini passate, e be/get used to + -ing' },
      { label: 'Past Perfect', desc: 'Sequenza di eventi passati', prompt: 'Past Perfect per descrivere la sequenza di eventi passati' },
      { label: 'Verbi + TO', desc: 'want to, decide to, hope to...', prompt: 'Verbi seguiti da TO + infinito (want to, decide to, hope to, promise to, plan to)' },
      { label: 'Verbi + -ING', desc: 'enjoy doing, avoid doing...', prompt: 'Verbi seguiti da -ING (enjoy, avoid, finish, suggest, mind)' },
      { label: 'Verbi "truffatori"', desc: 'stop, remember, forget, try...', prompt: 'Verbi che cambiano significato tra -ING e TO + infinito: stop, remember, forget, try, regret, mean' },
    ]},
    { id: 'u3', title: 'Unit 3', subtitle: 'Travelling', emoji: '✈️', topics: [
      { label: 'Modali di deduzione', desc: "must, can't, may, might, could", prompt: "Modali di deduzione e supposizione riferiti al presente e al passato: must, can't, may, might, could" },
    ]},
    { id: 'u4', title: 'Unit 4', subtitle: 'Food', emoji: '🍕', topics: [
      { label: 'Le forme del futuro', desc: 'will, going to, present continuous', prompt: 'Forme del futuro: Present Continuous per piani, going to per intenzioni, will per previsioni/promesse/decisioni immediate' },
      { label: 'Future Continuous e Perfect', desc: 'will be doing, will have done', prompt: 'Future Continuous (will be doing) e Future Perfect (will have done)' },
    ]},
    { id: 'u5', title: 'Unit 5', subtitle: 'Planet Earth', emoji: '🌍', topics: [

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function normalize(str) {
    return String(str || '').toLowerCase().trim().replace(/[.,!?;:]+$/g, '');
  }

  function stripLabel(str) {
    return String(str || '').replace(/^\s*[A-Za-z0-9]{1,2}[.)]\s*/, '').trim();
  }

  function renderCloze() {
    let html = escapeHtml(clozeData.text);
    clozeData.blanks.forEach((b) => {
      const marker = `[${b.number}]`;
      const replacement = `<span class="cloze-blank-wrap"><input type="text" class="cloze-input" data-num="${b.number}" size="8"></span>`;
      html = html.replace(marker, replacement);
    });

    contentEl.innerHTML = `
      <div class="ex-fade-in">
        <div class="cloze-text">${html}</div>
        <div class="ex-actions" style="margin-top:1rem;">
          <button class="btn-primary" id="cloze-check-btn">Correggi tutto</button>
        </div>
        <div class="cloze-results" id="cloze-results"></div>
      </div>
    `;

    document.getElementById('cloze-check-btn').addEventListener('click', checkCloze);
  }

  function checkCloze() {
    let correctCount = 0;
    const results = [];

    clozeData.blanks.forEach((b) => {
      const input = contentEl.querySelector(`.cloze-input[data-num="${b.number}"]`);
      const given = input ? input.value : '';
      const isCorrect = normalize(given) === normalize(b.correctAnswer);
      if (isCorrect) correctCount++;
      if (input) input.classList.add(isCorrect ? 'correct' : 'wrong');
      results.push({ ...b, given, isCorrect });
    });

    score = correctCount;
    quiz = { length: clozeData.blanks.length };
    currentTopic = 'Testo da completare';

    const resultsEl = document.getElementById('cloze-results');
    resultsEl.innerHTML = results.map((r) => `
      <div class="cloze-result-item">
        <div class="${r.isCorrect ? 'ex-wrong' : 'fb-wrong'}" style="color:${r.isCorrect ? 'var(--accent-green)' : '#f87171'}">
          [${r.number}] ${r.isCorrect ? '✅' : '❌'} ${escapeHtml(r.correctAnswer)}
          ${!r.isCorrect ? ` <span style="color:var(--text-dim)">(hai scritto: "${escapeHtml(r.given || '—')}")</span>` : ''}
        </div>
        ${r.rule ? `<div style="color:var(--accent-blue);font-size:0.78rem;margin-top:0.2rem;">📌 ${escapeHtml(r.rule)}</div>` : ''}
      </div>
    `).join('') + `
      <div class="ex-final" style="margin-top:1rem;">
        <div class="ex-final-score">${correctCount}/${clozeData.blanks.length}</div>

          <button class="btn-secondary" id="another-topic-btn">Torna al menu</button>
        </div>
      </div>
    `;

    SpeakEasyStorage.saveEserciziRisultato({ topic: 'Testo da completare (cloze)', score: correctCount, total: clozeData.blanks.length });

    document.getElementById('cloze-check-btn').disabled = true;
    document.getElementById('retry-topic-btn').addEventListener('click', loadCloze);
    document.getElementById('another-topic-btn').addEventListener('click', () => {
      renderVerificaMenu();

      contentEl.innerHTML = '';

  function renderQuestion() {
    const q = quiz[currentIndex];
    const pct = Math.round((currentIndex / quiz.length) * 100);

    let answerHtml = '';
    if (q.type === 'multiple_choice') {
      answerHtml = (q.options || []).map((opt) => `
        <button class="ex-option" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</button>
      `).join('');
    } else {
      answerHtml = `
        <input type="text" class="ex-fill-input" id="fill-input" placeholder="Scrivi la risposta...">
        <button class="btn-primary" id="fill-submit-btn" style="width:100%">Controlla</button>
      `;
    }

    contentEl.innerHTML = `
      <div class="ex-quiz ex-fade-in">
        <div class="ex-progress">
          <span>${currentIndex + 1}/${quiz.length}</span>

          <span>⭐ ${score}</span>
        </div>
        <div class="ex-question-card">

          <div id="ex-answer-area">${answerHtml}</div>
          <div id="ex-feedback-area"></div>
        </div>
      </div>
    `;

    if (q.type === 'multiple_choice') {
      contentEl.querySelectorAll('.ex-option').forEach((btn) => {
        btn.addEventListener('click', () => checkAnswer(btn.dataset.value, q));
      });
    } else {
      const submit = document.getElementById('fill-submit-btn');
      const input = document.getElementById('fill-input');
      submit.addEventListener('click', () => checkAnswer(input.value, q));
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit.click(); });
    }
  }

  function checkAnswer(given, q) {
    const isCorrect = normalize(given) === normalize(q.correctAnswer);
    if (isCorrect) score++;

    document.querySelectorAll('.ex-option, #fill-submit-btn, #fill-input').forEach((el) => { el.disabled = true; });

    if (q.type === 'multiple_choice') {
      contentEl.querySelectorAll('.ex-option').forEach((btn) => {
        if (normalize(btn.dataset.value) === normalize(q.correctAnswer)) btn.classList.add('correct');
        else if (btn.dataset.value === given) btn.classList.add('wrong');
      });
    } else {
      document.getElementById('fill-input').classList.add(isCorrect ? 'correct' : 'wrong');
    }

    const feedbackArea = document.getElementById('ex-feedback-area');
    feedbackArea.innerHTML = `
      <div class="ex-feedback ${isCorrect ? 'ok' : 'no'}">
        ${q.rule ? `<div class="fb-rule" style="margin-bottom:0.5rem;">📌 ${escapeHtml(q.rule)}</div>` : ''}
        ${isCorrect ? '✅ Giusto!' : '❌ Risposta corretta: ' + escapeHtml(q.correctAnswer)}
        <div class="explain">💡 ${escapeHtml(q.explanation_it)}</div>
      </div>
      <div class="ex-actions">
        <button class="btn-primary" id="next-btn">${currentIndex < quiz.length - 1 ? 'Prossima →' : 'Vedi il punteggio'}</button>
      </div>
    `;
    document.getElementById('next-btn').addEventListener('click', () => {
      currentIndex++;
      if (currentIndex < quiz.length) renderQuestion();
      else renderFinal();
    });
  }

  let realTestData = null;

  function renderRealTest() {
    let html = '<div class="ex-quiz ex-fade-in">';
    html += `<div class="real-test-header"><span class="topic-title">📋 Verifica reale</span><span class="unit-subtitle">${escapeHtml(currentTopic)}</span></div>`;

    realTestData.sections.forEach((section, sIndex) => {
      const meta = SECTION_META[section.type] || { icon: '📖', title: section.type };
      html += `<div class="real-section" data-section="${sIndex}">`;
      html += `<div class="real-section-title">${meta.icon} ${meta.title}</div>`;
      if (section.instructions) html += `<div class="real-instructions">${escapeHtml(section.instructions)}</div>`;

      if (section.type === 'word_bank_fill' && Array.isArray(section.wordBank)) {
        html += `<div class="word-bank">${section.wordBank.map((w) => `<span class="word-chip">${escapeHtml(w)}</span>`).join('')}</div>`;
      }
      if (section.type === 'matching_complete' && Array.isArray(section.listA)) {
        html += `<div class="match-list">${section.listA.map((a, i) => `<div>${String.fromCharCode(65 + i)}. ${escapeHtml(a)}</div>`).join('')}</div>`;
      }

      (section.items || []).forEach((item) => {
        html += `<div class="real-item" data-section="${sIndex}" data-number="${item.number}">`;
        html += `<div class="real-item-num">${item.number}.</div>`;

        if (section.type === 'multiple_choice') {
          html += `<div class="real-item-body"><div class="real-item-q">${escapeHtml(item.question)}</div>`;
          html += Object.entries(item.options || {}).map(([key, val]) => `
            <label class="real-radio">
              <input type="radio" name="mc-${sIndex}-${item.number}" value="${escapeHtml(key)}">
              <span><b>${escapeHtml(key)}.</b> ${escapeHtml(val)}</span>
            </label>
          `).join('') + '</div>';
        } else if (section.type === 'word_bank_fill') {
          const parts = String(item.text || '').split('___');
          html += `<div class="real-item-body">${escapeHtml(parts[0] || '')}<input type="text" class="real-inline-input" data-kind="fill">${escapeHtml(parts.slice(1).join('___') || '')}</div>`;
        } else if (section.type === 'matching_complete') {
          const opts = (section.listB || []).map(stripLabel);
          const parts = String(item.text || '').split('___');
          html += `<div class="real-item-body">${escapeHtml(parts[0] || '')}
            <select class="real-inline-select" data-kind="match">
              <option value="">—</option>
              ${opts.map((o, i) => `<option value="${escapeHtml(o)}">${String.fromCharCode(65 + i)}. ${escapeHtml(o)}</option>`).join('')}
            </select>
            ${escapeHtml(parts.slice(1).join('___') || '')}</div>`;
        } else if (section.type === 'transformation') {
          html += `<div class="real-item-body">
            <div class="real-trans-original">${escapeHtml(item.original || '')} <span class="real-trans-keyword">(${escapeHtml(item.keyword || '')})</span></div>
            <input type="text" class="real-inline-input real-trans-input" data-kind="trans" value="${escapeHtml(item.starter || '')}">
          </div>`;
        }
        html += `</div>`;
      });

      html += `<div class="real-section-score" id="real-score-${sIndex}"></div>`;
      html += `</div>`;
    });

    html += `<div class="ex-actions" style="margin-top:0.5rem;"><button class="btn-primary" id="real-check-btn">Correggi tutto</button></div>`;
    html += `<div class="real-final" id="real-final"></div>`;
    html += '</div>';

    contentEl.innerHTML = html;
    document.getElementById('real-check-btn').addEventListener('click', checkRealTest);
  }

  function checkRealTest() {
    let totalCorrect = 0;
    let totalItems = 0;

    realTestData.sections.forEach((section, sIndex) => {
      let sectionCorrect = 0;
      (section.items || []).forEach((item) => {
        totalItems++;
        const itemEl = contentEl.querySelector(`.real-item[data-section="${sIndex}"][data-number="${item.number}"]`);
        let given = '';
        let isCorrect = false;

        if (section.type === 'multiple_choice') {
          const checked = itemEl.querySelector('input[type="radio"]:checked');
          given = checked ? checked.value : '';
          isCorrect = !!given && normalize(given) === normalize(item.correctAnswer);
          itemEl.querySelectorAll('.real-radio').forEach((label) => {
            const input = label.querySelector('input');
            if (normalize(input.value) === normalize(item.correctAnswer)) label.classList.add('correct');
            else if (input.value === given) label.classList.add('wrong');
            input.disabled = true;
          });
        } else if (section.type === 'word_bank_fill') {
          const input = itemEl.querySelector('.real-inline-input');
          given = input ? input.value : '';
          isCorrect = normalize(given) === normalize(item.correctAnswer);
          if (input) { input.classList.add(isCorrect ? 'correct' : 'wrong'); input.disabled = true; }
        } else if (section.type === 'matching_complete') {
          const select = itemEl.querySelector('.real-inline-select');
          given = select ? select.value : '';
          isCorrect = normalize(stripLabel(given)) === normalize(stripLabel(item.correctAnswer));
          if (select) { select.classList.add(isCorrect ? 'correct' : 'wrong'); select.disabled = true; }
        } else if (section.type === 'transformation') {
          const input = itemEl.querySelector('.real-trans-input');
          given = input ? input.value : '';
          isCorrect = normalize(given) === normalize(item.correctAnswer);
          if (input) { input.classList.add(isCorrect ? 'correct' : 'wrong'); input.disabled = true; }
        }

        if (isCorrect) { sectionCorrect++; totalCorrect++; }

        if (!isCorrect) {
          const bodyEl = itemEl.querySelector('.real-item-body');
          if (bodyEl) bodyEl.insertAdjacentHTML('beforeend', `<div class="real-item-hint">✅ ${escapeHtml(item.correctAnswer)}</div>`);
        }
      });

      const scoreEl = document.getElementById(`real-score-${sIndex}`);
      if (scoreEl) scoreEl.textContent = `${sectionCorrect}/${(section.items || []).length}`;
    });

    document.getElementById('real-check-btn').disabled = true;

    const finalEl = document.getElementById('real-final');
    const pct = Math.round((totalCorrect / totalItems) * 100);
    const msg = pct >= 80 ? 'Fantastico! Sei pronta per la verifica vera! 🎉'
      : pct >= 50 ? 'Buon lavoro, ma ripassa ancora un po\' 💪'
      : 'Vale la pena rivedere le regole prima della verifica 📖';

    finalEl.innerHTML = `
      <div class="ex-final">
        <div class="ex-final-score">${totalCorrect}/${totalItems}</div>
        <p style="color:var(--text-dim);font-size:0.9rem;">${msg}</p>
        <div class="ex-actions" style="margin-top:1.2rem;">
          <button class="btn-primary" id="real-retry-btn">Rifai una verifica nuova</button>
        </div>
        <div class="ex-actions" style="margin-top:0.6rem;">
          <button class="btn-secondary" id="real-back-btn">Un altro argomento</button>
        </div>
      </div>
    `;

    SpeakEasyStorage.saveEserciziRisultato({ topic: `Verifica reale — ${currentTopic}`, score: totalCorrect, total: totalItems });

    document.getElementById('real-retry-btn').addEventListener('click', () => loadRealTest(currentTopic));
    document.getElementById('real-back-btn').addEventListener('click', () => switchTab('real'));

    finalEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function switchTab(tab) {
    const tabTopic = document.getElementById('ex-tab-topic');
    const tabVerifica = document.getElementById('ex-tab-verifica');
    const tabReal = document.getElementById('ex-tab-real');
    const verificaMenu = document.getElementById('ex-verifica-menu');
    tabTopic.classList.remove('active');
    tabVerifica.classList.remove('active');
    tabReal.classList.remove('active');
    unitsEl.style.display = 'none';
    topicsEl.style.display = 'none';
    verificaMenu.style.display = 'none';
    contentEl.innerHTML = '';
    if (tab === 'verifica') {
      tabVerifica.classList.add('active');
      verificaMenu.style.display = 'flex';
    } else if (tab === 'real') {
      tabReal.classList.add('active');
      topicPickerMode = 'realtest';
      unitsEl.style.display = 'flex';
      renderUnits();
    } else {
      tabTopic.classList.add('active');
      topicPickerMode = 'practice';
      unitsEl.style.display = 'flex';
      renderUnits();
    }
  }

  document.getElementById('ex-tab-topic').addEventListener('click', () => switchTab('topic'));
  document.getElementById('ex-tab-verifica').addEventListener('click', () => switchTab('verifica'));
  document.getElementById('ex-tab-real').addEventListener('click', () => switchTab('real'));

  renderUnits();
  renderVerificaMenu();
</script>

</body>
</html>
