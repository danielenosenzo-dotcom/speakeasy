<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="google" content="notranslate">
<title>SpeakEasy — Regole Grammaticali</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f0a1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/avatar.css">
<style>
  html, body { overflow-y: auto; height: auto; }

  .gr-screen {
    min-height: 100vh;
    height: auto;
    justify-content: flex-start;
    gap: 1.2rem;
    padding: 1.5rem 1.4rem 3rem;
  }

  .gr-topbar {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .back-link {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 1.3rem;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gr-title {
    font-family: var(--font-heading);
    font-size: 1.2rem;
  }

  .gr-topics, .gr-units {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }

  .unit-subtitle {
    font-size: 0.76rem;
    color: var(--text-dim);
    margin-top: 0.1rem;
  }

  .back-to-units {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.82rem;
    text-align: left;
    padding: 0.3rem 0;
    margin-bottom: -0.3rem;
  }

  .topic-card {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    width: 100%;
    box-sizing: border-box;
    background: var(--surface);
    border: none;
    border-left: 4px solid var(--accent-green);
    border-radius: var(--radius-md);
    padding: 0.9rem 1.1rem;
    min-height: 60px;
    text-align: left;
    color: var(--text);
    font-family: var(--font-body);
  }

  .topic-card:active { transform: scale(0.97); }
  .topic-card {
    opacity: 0;
    transform: translateY(-10px);
    animation: gr-drop 0.4s ease forwards;
    transition: transform 0.15s ease;
  }
  .gr-topics .topic-card:nth-child(1), .gr-units .topic-card:nth-child(1) { animation-delay: 0.04s; }
  .gr-topics .topic-card:nth-child(2), .gr-units .topic-card:nth-child(2) { animation-delay: 0.09s; }
  .gr-topics .topic-card:nth-child(3), .gr-units .topic-card:nth-child(3) { animation-delay: 0.14s; }
  .gr-topics .topic-card:nth-child(4), .gr-units .topic-card:nth-child(4) { animation-delay: 0.19s; }
  .gr-topics .topic-card:nth-child(5), .gr-units .topic-card:nth-child(5) { animation-delay: 0.24s; }
  .gr-topics .topic-card:nth-child(6), .gr-units .topic-card:nth-child(6) { animation-delay: 0.29s; }
  .gr-topics .topic-card:nth-child(7), .gr-units .topic-card:nth-child(7) { animation-delay: 0.34s; }

  @keyframes gr-drop {
    to { opacity: 1; transform: translateY(0); }
  }

  .gr-fade-in {
    animation: gr-fade 0.35s ease forwards;
  }
  @keyframes gr-fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .topic-icon { font-size: 1.4rem; flex-shrink: 0; }
  .topic-title { font-family: var(--font-heading); font-size: 0.95rem; }
  .topic-desc { font-size: 0.76rem; color: var(--text-dim); margin-top: 0.1rem; }

  .gr-custom {
    display: flex;
    gap: 0.5rem;
    width: 100%;
    max-width: 480px;
  }

  .gr-custom input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--surface-2);
    color: var(--text);
    border-radius: var(--radius-full);
    padding: 0.7rem 1.1rem;
    font-size: 16px;
    font-family: var(--font-body);
  }

  .gr-state {
    width: 100%;
    max-width: 480px;
    text-align: center;
    color: var(--text-dim);
    padding: 2rem 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
  }

  .gr-loading-dots {
    display: flex;
    gap: 5px;
  }
  .gr-loading-dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-green);
    animation: gr-bounce 1.2s ease-in-out infinite;
  }
  .gr-loading-dots span:nth-child(2) { animation-delay: 0.15s; }
  .gr-loading-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes gr-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  .gr-error {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-left: 4px solid #f87171;
    border-radius: var(--radius-md);
    padding: 1rem 1.2rem;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  .gr-lesson {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .gr-lesson-title {
    font-family: var(--font-heading);
    font-size: 1.15rem;
  }

  .gr-lesson-intro {
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  .gr-section {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 1.1rem 1.2rem;
  }

  .gr-section h3 {
    font-family: var(--font-heading);
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
    color: var(--accent-green);
  }

  .gr-section p {
    font-size: 0.88rem;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 0.6rem;
  }

  .gr-example {
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    padding: 0.6rem 0.8rem;
    margin-bottom: 0.4rem;
    font-size: 0.85rem;
  }
  .gr-example .en { color: var(--accent-blue); }
  .gr-example .it { color: var(--text-dim); font-size: 0.78rem; margin-top: 0.15rem; }

  .gr-mistakes {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 1.1rem 1.2rem;
  }

  .gr-mistake {
    margin-bottom: 0.7rem;
    font-size: 0.85rem;
  }
  .gr-mistake:last-child { margin-bottom: 0; }
  .gr-mistake .wrong { color: #f87171; }
  .gr-mistake .correct { color: var(--accent-green); }
  .gr-mistake .why { color: var(--text-dim); font-size: 0.8rem; margin-top: 0.2rem; }

  .gr-tip {
    background: linear-gradient(135deg, rgba(192,132,252,0.12), rgba(244,114,182,0.12));
    border-radius: var(--radius-md);
    padding: 1rem 1.2rem;
    font-size: 0.88rem;
    color: var(--text);
  }

  .gr-actions {
    display: flex;
    justify-content: center;
    padding-top: 0.5rem;
  }
</style>
</head>
<body>

<div class="screen gr-screen">
  <div class="gr-topbar">
    <a href="index.html" class="back-link">←</a>
    <span class="gr-title">📖 Regole Grammaticali</span>
  </div>

  <div class="gr-units" id="gr-units"></div>
  <div class="gr-topics" id="gr-topics" style="display:none;"></div>

  <div class="gr-custom" id="gr-custom-row">
    <input type="text" id="custom-topic-input" placeholder="Oppure scrivi un argomento a piacere...">
    <button class="btn-primary" id="custom-topic-btn" style="padding:0.7rem 1.2rem; font-size:0.85rem;">Vai</button>
  </div>

  <div id="gr-content"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="api-config.js"></script>
<script src="js/storage.js"></script>
<script src="js/ai-content.js"></script>
<script>
  const SYSTEM_PROMPT = `Stai creando una lezione di grammatica inglese per una ragazza italiana di 15 anni, al primo anno di liceo scientifico Cambridge. Deve capire bene l'argomento richiesto.

Rispondi SOLO con un oggetto JSON valido (niente markdown, niente code fence) con questa forma esatta:
{
  "title": "...",
  "intro": "...",
  "sections": [
    { "subtitle": "...", "explanation_it": "...", "examples": [{"en": "...", "it": "..."}] }
  ],
  "common_mistakes": [
    { "wrong": "...", "correct": "...", "why_it": "..." }
  ],
  "tip": "..."
}

Regole:
- "intro", "explanation_it", "why_it", "tip" in italiano, chiari e non accademici — parla come una spiegazione amichevole, non un libro di testo
- "examples" mostra la frase inglese (en) con traduzione italiana (it)
- 3-5 "sections", 2-4 "common_mistakes"
- Tono incoraggiante, adatto a un'adolescente, mai condiscendente`;

  const UNITS = [
    { id: 'u1', title: 'Unit 1', subtitle: 'Appearance, personality and relationships', emoji: '🧑', topics: [
      { label: 'Present Simple vs Continuous', desc: 'Verbi stativi e dinamici', prompt: 'Present Simple vs Present Continuous, inclusa la differenza tra verbi stativi (stative) e dinamici, ed espressioni con i verbi di percezione (seem, equivalenti di "sembrare")' },
      { label: 'Domande soggetto e oggetto', desc: 'Wh-questions', prompt: 'Subject and object questions, Wh-questions che finiscono con una preposizione' },
      { label: 'Aggettivi di personalità', desc: 'Emozioni in -ing e -ed', prompt: 'Aggettivi di personalità, contrari, prefissi negativi, aggettivi + preposizione, aggettivi di emozione in -ing e -ed, avverbi di grado (very, really, fairly, quite, rather, a bit)' },
      { label: 'Present Perfect (for/since)', desc: 'Durata nel presente', prompt: 'Present Perfect per esprimere la durata nel presente con for e since, e il Present Perfect Continuous enfatico, differenza tra durata negativa vera e falsa' },
    ]},
    { id: 'u2', title: 'Unit 2', subtitle: 'Sport and Leisure', emoji: '⚽', topics: [
      { label: 'Past Simple vs Continuous', desc: 'Azioni in corso nel passato', prompt: 'Past Simple vs Past Continuous per parlare di azioni in corso o temporanee nel passato, uso di when e while' },
      { label: 'Past Simple vs Present Perfect', desc: 'Passato definito e indefinito', prompt: 'Past Simple vs Present Perfect, passato definito e indefinito, uso di ever/never/already/yet/still/just, been vs gone' },
      { label: 'Used to / Would', desc: 'Abitudini passate', prompt: 'Used to e would per esprimere abitudini passate, e be/get used to + -ing per abitudini generali' },
      { label: 'Past Perfect', desc: 'Sequenza di eventi passati', prompt: 'Past Perfect per descrivere la sequenza di eventi passati, connettori temporali, e Past Perfect Continuous enfatico' },
      { label: 'Verbi + TO', desc: 'want to, decide to, hope to...', prompt: 'Verbi seguiti da TO + infinito (want to, decide to, hope to, promise to, plan to)' },
      { label: 'Verbi + -ING', desc: 'enjoy doing, avoid doing...', prompt: 'Verbi seguiti da -ING (enjoy, avoid, finish, suggest, mind), forma -ing come sostantivo, gerundio dopo aggettivo/nome + preposizione' },
      { label: 'Verbi "truffatori"', desc: 'stop, remember, forget, try...', prompt: 'Verbi che cambiano significato tra -ING e TO + infinito: stop, remember, forget, try, regret, mean' },
    ]},
    { id: 'u3', title: 'Unit 3', subtitle: 'Travelling', emoji: '✈️', topics: [
      { label: 'Modali di deduzione', desc: "must, can't, may, might, could", prompt: "Modali di deduzione e supposizione riferiti al presente e al passato: must, can't, may, might, could + i quattro tipi di infinito (do, be doing, have done, have been doing)" },
    ]},
    { id: 'u4', title: 'Unit 4', subtitle: 'Food', emoji: '🍕', topics: [
      { label: 'Le forme del futuro', desc: 'will, going to, present continuous', prompt: 'Forme del futuro: Simple Present con significato futuro, Present Continuous per piani futuri, going to per intenzioni, will per previsioni/promesse/decisioni immediate, Will you...? per richieste' },
      { label: 'Future Continuous e Perfect', desc: 'will be doing, will have done', prompt: 'Future Continuous (will be doing) e Future Perfect semplice (will have done) e continuo (will have been doing)' },
    ]},
    { id: 'u5', title: 'Unit 5', subtitle: 'Planet Earth', emoji: '🌍', topics: [
      { label: 'Relative clauses', desc: 'who, which, that, where, whose', prompt: 'Defining and non-defining relative clauses: who/which/that come soggetto, oggetto e complemento, where/when/whose' },
      { label: 'Articolo "the"', desc: 'Usi dell\'articolo determinativo', prompt: 'Usi dell\'articolo determinativo "the" in inglese' },
    ]},
    { id: 'u6', title: 'Unit 6', subtitle: 'Good health', emoji: '🏥', topics: [
      { label: 'Second e Third Conditional', desc: 'Ipotesi presenti e passate', prompt: 'Second Conditional (ipotesi irreale sul presente/futuro) e Third Conditional (ipotesi irreale sul passato): struttura, uso, differenza tra i due, e mix conditional (Second + Third combinati)' },
      { label: 'Wish / If only', desc: 'Desideri e rimpianti', prompt: 'Wish e If only per esprimere desideri sul presente (+ Past Simple), rimpianti sul passato (+ Past Perfect), e desideri di cambiare un comportamento altrui o proprio (+ would)' },
    ]},
    { id: 'altro', title: 'Altri argomenti', subtitle: "Studiati durante l'anno", emoji: '📚', topics: [
      { label: 'Modali di obbligo', desc: "must, have to, should...", prompt: "Modali ed espressioni di obbligo, necessità, proibizione, mancanza di obbligo, consiglio: must, have to, mustn't, can't, be allowed to, don't have to, needn't, should" },
      { label: 'Comparativi e superlativi', desc: 'Aggettivi, nomi e verbi', prompt: 'Comparativi e superlativi di maggioranza e minoranza con aggettivi (anche irregolari), con nomi e verbi, comparativo di uguaglianza "the same...as"' },
      { label: 'Condizionali', desc: 'Zero, primo e secondo', prompt: 'Zero, First e Second Conditional: struttura di base e usi di if/unless' },
    ]},
  ];

  const unitsEl = document.getElementById('gr-units');
  const topicsEl = document.getElementById('gr-topics');
  const customInput = document.getElementById('custom-topic-input');
  const customBtn = document.getElementById('custom-topic-btn');
  const contentEl = document.getElementById('gr-content');

  function renderUnits() {
    unitsEl.innerHTML = UNITS.map((u) => `
      <button class="topic-card" data-unit="${u.id}" style="border-left-color:var(--accent-green)">
        <span class="topic-icon">${u.emoji}</span>
        <span><span class="topic-title">${u.title}</span><br><span class="unit-subtitle">${u.subtitle}</span></span>
      </button>
    `).join('');
    unitsEl.querySelectorAll('.topic-card').forEach((btn) => {
      btn.addEventListener('click', () => renderUnitTopics(UNITS.find((u) => u.id === btn.dataset.unit)));
    });
    unitsEl.style.display = 'flex';
    topicsEl.style.display = 'none';
  }

  function renderUnitTopics(unit) {
    topicsEl.innerHTML = `
      <button class="back-to-units" id="back-to-units-btn">← Tutte le unità</button>
      ${unit.topics.map((t) => `
        <button class="topic-card" data-prompt="${escapeHtml(t.prompt)}">
          <span class="topic-icon">${unit.emoji}</span>
          <span><span class="topic-title">${escapeHtml(t.label)}</span><br><span class="topic-desc">${escapeHtml(t.desc)}</span></span>
        </button>
      `).join('')}
    `;
    topicsEl.querySelectorAll('.topic-card').forEach((btn) => {
      btn.addEventListener('click', () => loadTopic(btn.dataset.prompt));
    });
    document.getElementById('back-to-units-btn').addEventListener('click', renderUnits);
    unitsEl.style.display = 'none';
    topicsEl.style.display = 'flex';
  }

  function setState(html) {
    contentEl.innerHTML = html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  async function loadTopic(topic) {
    unitsEl.style.display = 'none';
    topicsEl.style.display = 'none';
    customInput.parentElement.style.display = 'none';
    setState(`
      <div class="gr-state">
        <span>✨ Zoe sta preparando la lezione...</span>
        <div class="gr-loading-dots"><span></span><span></span><span></span></div>
      </div>
    `);

    try {
      const lesson = await AIContent.askJSON(
        `Argomento richiesto: ${topic}`,
        SYSTEM_PROMPT,
        3500
      );
      renderLesson(lesson, topic);
      SpeakEasyStorage.saveGrammaticaLezione({ topic, title: lesson.title || topic });
    } catch (err) {
      setState(`
        <div class="gr-error gr-fade-in">
          😕 ${escapeHtml(err.message)}
          <div class="gr-actions"><button class="btn-secondary" id="retry-btn" style="margin-top:0.8rem">Riprova</button></div>
        </div>
      `);
      document.getElementById('retry-btn').addEventListener('click', () => loadTopic(topic));
    }
  }

  function renderLesson(lesson, topic) {
    const sections = (lesson.sections || []).map((s) => `
      <div class="gr-section">
        <h3>${escapeHtml(s.subtitle)}</h3>
        <p>${escapeHtml(s.explanation_it)}</p>
        ${(s.examples || []).map((ex) => `
          <div class="gr-example">
            <div class="en">✅ ${escapeHtml(ex.en)}</div>
            <div class="it">${escapeHtml(ex.it)}</div>
          </div>
        `).join('')}
      </div>
    `).join('');

    const mistakes = (lesson.common_mistakes || []).length ? `
      <div class="gr-mistakes">
        <h3 style="font-family:var(--font-heading);color:#f87171;margin-bottom:0.6rem;">⚠️ Errori comuni</h3>
        ${(lesson.common_mistakes || []).map((m) => `
          <div class="gr-mistake">
            <div class="wrong">❌ ${escapeHtml(m.wrong)}</div>
            <div class="correct">✅ ${escapeHtml(m.correct)}</div>
            <div class="why">💡 ${escapeHtml(m.why_it)}</div>
          </div>
        `).join('')}
      </div>
    ` : '';

    const tip = lesson.tip ? `<div class="gr-tip">💡 ${escapeHtml(lesson.tip)}</div>` : '';

    setState(`
      <div class="gr-lesson gr-fade-in">
        <div>
          <div class="gr-lesson-title">${escapeHtml(lesson.title || topic)}</div>
          <p class="gr-lesson-intro">${escapeHtml(lesson.intro || '')}</p>
        </div>
        ${sections}
        ${mistakes}
        ${tip}
        <div class="gr-actions">
          <button class="btn-secondary" id="another-topic-btn">Un altro argomento</button>
        </div>
      </div>
    `);

    document.getElementById('another-topic-btn').addEventListener('click', () => {
      renderUnits();
      customInput.parentElement.style.display = 'flex';
      setState('');
    });
  }

  customBtn.addEventListener('click', () => {
    const val = customInput.value.trim();
    if (val) loadTopic(val);
  });
  customInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') customBtn.click();
  });

  renderUnits();
</script>

</body>
</html>
